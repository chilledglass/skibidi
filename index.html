---
layout: default
---

{% assign latest = site.posts.first %}

<section class="quote">

    <time datetime="{{ latest.date | date_to_xmlschema }}">
        {{ latest.date | date: "%-d %B %Y" }}
    </time>

    <h2>{{ latest.title }}</h2>

    <div class="entry-content">
        {{ latest.content }}
    </div>

<style>
  .mc-status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-radius: 999px;
    background: #1e1e24;
    color: #f2f2f2;
    font: 500 15px/1 system-ui, sans-serif;
    border: 1px solid #33333d;
  }
  .mc-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #888;
  }
  .mc-status.online .mc-dot {
    background: #3ddc84;
    box-shadow: 0 0 8px #3ddc84;
    animation: mc-pulse 2s infinite;
  }
  .mc-status.offline .mc-dot { background: #ef4444; }
  .mc-sub { opacity: 0.6; font-weight: 400; }
  @keyframes mc-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>


</section>
