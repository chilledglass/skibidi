---
layout: default
title: Archive
permalink: /archive/
---

<section class="archive">

    <h2>Archive</h2>

    <ul>
        {% for post in site.posts %}
            <li>
                <time datetime="{{ post.date | date_to_xmlschema }}">
                    {{ post.date | date: "%-d %B %Y" }}
                </time>

                <a href="{{ post.url | relative_url }}">
                    {{ post.title }}
                </a>
            </li>
        {% endfor %}
    </ul>

</section>
